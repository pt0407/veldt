name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          BIN=veldt
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=veldt.exe; fi
          cp target/${{ matrix.target }}/release/$BIN dist/
          tar -czf veldt-${{ matrix.target }}.tar.gz -C dist $BIN
      - uses: softprops/action-gh-release@v2
        with:
          files: veldt-${{ matrix.target }}.tar.gz
