[package]
name = "veldt"
version = "0.3.0"
edition = "2021"
description = "A scripting language where code lives in an evolving garden — functions are born, compete, speciate, and die."
license = "MIT"
repository = "https://github.com/pt0407/veldt"
homepage = "https://github.com/pt0407/veldt"
keywords = ["language", "interpreter", "evolution", "scripting"]
categories = ["compilers", "command-line-utilities"]
exclude = ["target", "bench", "docs", "examples"]

[[bin]]
name = "veldt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
im = { version = "15.1.0", features = ["serde"] }
