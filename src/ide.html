<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veldt Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #050807;
    --bg-soil: #0c1210;
    --bg-card: #0f1614;
    --bg-editor: #0a0e0c;
    --moss: #4a7c59;
    --moss-bright: #6fae7f;
    --moss-glow: rgba(111, 174, 127, 0.15);
    --bloom: #8ec5a0;
    --amber: #c9a96e;
    --rust: #b85450;
    --ash: #5a6560;
    --fog: #8a9590;
    --text: #b8c8be;
    --text-dim: #5a6b62;
    --border: rgba(74, 124, 89, 0.15);
    --border-bright: rgba(111, 174, 127, 0.3);
  }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--bg-soil);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--bloom);
  }
  .logo em { font-style: italic; color: var(--amber); }
  .file-selector {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .file-selector:hover { border-color: var(--border-bright); }
  .topbar-right { display: flex; gap: 8px; }
  .btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--border-bright); color: var(--bloom); }
  .btn.primary {
    background: rgba(111, 174, 127, 0.1);
    border-color: var(--moss-bright);
    color: var(--moss-bright);
  }
  .btn.primary:hover { background: rgba(111, 174, 127, 0.2); }
  .btn.amber {
    border-color: var(--amber);
    color: var(--amber);
  }
  .btn.amber:hover { background: rgba(201, 169, 110, 0.1); }
  .btn.danger {
    border-color: rgba(184, 84, 80, 0.3);
    color: var(--rust);
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left: Garden panel */
  .garden-panel {
    width: 260px;
    background: var(--bg-soil);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--fog);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .garden-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .garden-item {
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .garden-item:hover { background: rgba(111, 174, 127, 0.05); }
  .garden-item.selected { background: rgba(111, 174, 127, 0.1); }
  .garden-item .icon { color: var(--moss-bright); font-size: 14px; }
  .garden-item .name { color: var(--text); }
  .garden-item .meta { color: var(--text-dim); font-size: 10px; margin-left: auto; }
  .garden-item.healthy .icon { color: var(--moss-bright); }
  .garden-item.sick .icon { color: var(--rust); }
  .garden-item.dying .icon { color: var(--ash); }
  .garden-item.immortal .icon { color: var(--amber); }
  .variant-item {
    padding: 4px 12px 4px 28px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 1px solid var(--border);
    margin-left: 18px;
  }
  .variant-item:hover { color: var(--text); }
  .variant-item .star { color: var(--amber); }
  .variant-item.healthy { color: var(--moss-bright); }
  .variant-item.sick { color: var(--rust); }
  .variant-item .vid { color: var(--text-dim); }
  .variant-item .origin-tag { color: var(--ash); font-size: 9px; font-style: italic; }

  /* Lineage tree */
  .tree-node { position: relative; }
  .tree-children {
    margin-left: 10px;
    border-left: 1px dashed var(--border-bright);
    padding-left: 4px;
  }
  .tree-node > .variant-item { margin-left: 0; }

  /* Niche badges */
  .niche-badge {
    display: inline-block;
    background: rgba(201, 169, 110, 0.12);
    color: var(--amber);
    border: 1px solid rgba(201, 169, 110, 0.3);
    border-radius: 3px;
    font-size: 8px;
    padding: 0 4px;
    margin-left: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .niche-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    font-size: 10px;
  }
  .niche-bar .niche-name { color: var(--text-dim); width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .niche-bar .niche-track { flex: 1; height: 4px; background: var(--bg-card); border-radius: 2px; overflow: hidden; }
  .niche-bar .niche-fill { height: 100%; background: var(--moss); }
  .niche-bar .niche-pct { color: var(--text); width: 34px; text-align: right; }

  /* Source diff view */
  .diff-view {
    margin: 14px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    font-size: 10.5px;
    line-height: 1.5;
  }
  .diff-view .diff-line { padding: 1px 8px; white-space: pre; overflow-x: auto; }
  .diff-view .diff-line.add { background: rgba(111,174,127,0.12); color: var(--moss-bright); }
  .diff-view .diff-line.del { background: rgba(184,84,80,0.10); color: var(--rust); }
  .diff-view .diff-line.same { color: var(--text-dim); }
  .diff-title { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px }

  .probe-info {
    padding: 6px 12px;
    font-size: 10px;
    color: var(--ash);
    font-style: italic;
  }

  /* Panel tabs (Inspector / Gardener) */
  .panel-tabs { display: flex; gap: 14px; font-style: normal; }
  .panel-tabs .tab {
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    transition: color 0.2s;
  }
  .panel-tabs .tab:hover { color: var(--text); }
  .panel-tabs .tab.active { color: var(--bloom); }
  .inspector-panel.wide { width: 380px; }

  /* Agent panel */
  .agent-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .agent-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    font-size: 12px;
  }
  .agent-empty {
    color: var(--text-dim);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    text-align: center;
    padding: 30px 16px;
    line-height: 1.6;
  }
  .agent-msg { margin-bottom: 14px; }
  .agent-msg .who {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .agent-msg.user .who { color: var(--amber); text-align: right; }
  .agent-msg.user .bubble {
    color: var(--amber);
    text-align: right;
    font-style: italic;
  }
  .agent-msg.gardener .who { color: var(--moss-bright); }
  .agent-msg .bubble { white-space: pre-wrap; line-height: 1.5; }
  .agent-steps {
    border-left: 2px solid var(--border);
    padding-left: 8px;
    margin: 6px 0;
  }
  .agent-step { font-size: 11px; color: var(--text-dim); padding: 1px 0; white-space: pre-wrap; }
  .agent-step.plan { color: var(--amber); font-style: italic; }
  .agent-step.act { color: var(--fog); }
  .agent-step.obs { color: var(--text-dim); }
  .agent-step.ok { color: var(--moss-bright); }
  .agent-step.err { color: var(--rust); }
  .agent-block {
    background: var(--bg-editor);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .agent-block pre {
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.5;
    overflow: auto;
    max-height: 220px;
    white-space: pre;
    color: var(--text);
  }
  .agent-block .block-actions {
    display: flex;
    gap: 6px;
    padding: 5px 8px;
    border-top: 1px solid var(--border);
  }
  .agent-block .block-actions .btn { padding: 3px 10px; font-size: 10px; }
  .agent-input-row {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .agent-input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  .agent-input:focus { border-color: var(--border-bright); }
  .agent-thinking { color: var(--text-dim); font-style: italic; font-size: 11px; }
  .agent-suggest {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
  }
  .chip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 11px;
    font-style: normal;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--border-bright); color: var(--moss-bright); }

  /* Center: Editor + Output */
  .center-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .editor-container {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #editor {
    position: absolute;
    inset: 0;
  }

  /* Output bar */
  .output-panel {
    height: 180px;
    background: var(--bg-editor);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .output-header {
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .output-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    font-size: 12px;
    line-height: 1.6;
  }
  .output-line { white-space: pre-wrap; }
  .output-line.event { color: var(--amber); }
  .output-line.error { color: var(--rust); }
  .output-line.success { color: var(--moss-bright); }

  /* Right: Inspector */
  .inspector-panel {
    width: 280px;
    background: var(--bg-soil);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .inspector-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .inspector-empty {
    color: var(--text-dim);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    text-align: center;
    padding: 40px 20px;
  }
  .inspector-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--bloom);
    margin-bottom: 16px;
  }
  .inspector-stat {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .inspector-stat .key { color: var(--text-dim); }
  .inspector-stat .val { color: var(--text); font-weight: 500; }
  .inspector-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .inspector-actions .btn { flex: 1; text-align: center; padding: 6px; font-size: 11px; }
  .obituary-list {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .obituary-item {
    padding: 8px 0;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .obituary-item .name { color: var(--fog); }
  .obituary-item .cause { color: var(--amber); font-style: italic; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--moss-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Monaco theme overrides */
  .monaco-editor .margin { background: var(--bg-editor) !important; }
  .monaco-editor .monaco-editor-background { background: var(--bg-editor) !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Veldt <em>Studio</em></div>
    <select class="file-selector" id="fileSelector">
      <option value="">— open file —</option>
    </select>
  </div>
  <div class="topbar-right">
    <button class="btn" id="saveBtn">Save</button>
    <button class="btn amber" id="evolveBtn">Evolve</button>
    <button class="btn danger" id="clearBtn">Clear Garden</button>
    <button class="btn primary" id="runBtn">▶ Run</button>
  </div>
</div>

<div class="main">
  <!-- Garden Panel -->
  <div class="garden-panel">
    <div class="panel-header">Garden</div>
    <div class="garden-content" id="gardenTree"></div>
  </div>

  <!-- Center: Editor + Output -->
  <div class="center-panel">
    <div class="editor-container">
      <div id="editor"></div>
    </div>
    <div class="output-panel">
      <div class="output-header">
        <span>Output</span>
        <span id="outputStatus"></span>
      </div>
      <div class="output-content" id="output"></div>
    </div>
  </div>

  <!-- Right Panel: Inspector / Gardener agent -->
  <div class="inspector-panel" id="rightPanel">
    <div class="panel-header panel-tabs">
      <span class="tab active" id="tabInspector">Inspector</span>
      <span class="tab" id="tabAgent">Gardener</span>
    </div>
    <div class="inspector-content" id="inspector">
      <div class="inspector-empty">Select a function from the garden to inspect it.</div>
    </div>
    <div class="agent-panel" id="agentPanel" style="display:none">
      <div class="agent-messages" id="agentMessages">
        <div class="agent-empty">
          The Gardener tends this veldt.
          <div class="agent-suggest">
            <button class="chip" onclick="askAgent('write a fibonacci function')">write a fibonacci function</button>
            <button class="chip" onclick="askAgent('improve fib')">improve fib</button>
            <button class="chip" onclick="askAgent('write something parallel')">parallel</button>
            <button class="chip" onclick="askAgent('surprise me')">surprise me</button>
            <button class="chip" onclick="askAgent('show fib')">show fib</button>
            <button class="chip" onclick="askAgent('tend the garden')">tend the garden</button>
            <button class="chip" onclick="askAgent('obituaries')">obituaries</button>
            <button class="chip" onclick="askAgent('what\'s alive?')">what's alive?</button>
          </div>
        </div>
      </div>
      <div class="agent-input-row">
        <input class="agent-input" id="agentInput" placeholder="ask the gardener..." autocomplete="off">
        <button class="btn primary" id="agentSend">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
const API = '';
let gardenData = null;
let lastAgentCode = null;
let selectedVariant = null;
let editor = null;
let currentFilename = '';

// --- Monaco Editor ---
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
require(['vs/editor/editor.main'], function() {
  monaco.editor.defineTheme('veldt', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'keyword', foreground: '6fae7f', fontStyle: 'bold' },
      { token: 'string', foreground: 'c9a96e' },
      { token: 'number', foreground: '8ec5a0' },
      { token: 'comment', foreground: '5a6b62', fontStyle: 'italic' },
      { token: 'type', foreground: '6fae7f' },
    ],
    colors: {
      'editor.background': '#0a0e0c',
      'editor.foreground': '#b8c8be',
      'editorLineNumber.foreground': '#5a6b62',
      'editor.selectionBackground': '#1a2a20',
      'editor.lineHighlightBackground': '#0f1614',
      'editorCursor.foreground': '#6fae7f',
    }
  });

  editor = monaco.editor.create(document.getElementById('editor'), {
    value: getStarterCode(),
    language: 'javascript', // close enough for highlighting
    theme: 'veldt',
    fontFamily: 'JetBrains Mono, monospace',
    fontSize: 14,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    padding: { top: 16, bottom: 16 },
    automaticLayout: true,
    tabSize: 4,
  });

  // Autocomplete: keywords, builtins, and garden function names
  monaco.languages.registerCompletionItemProvider('javascript', {
    provideCompletionItems: function(model, position) {
      const word = model.getWordUntilPosition(position);
      const range = {
        startLineNumber: position.lineNumber,
        endLineNumber: position.lineNumber,
        startColumn: word.startColumn,
        endColumn: word.endColumn,
      };
      const kw = ['fn','let','if','else','while','for','in','return','grow','struct',
        'test','try','catch','import','match','null','true','false','and','or','not'];
      const builtins = ['print','len','push','keys','dict','set','int','float','str','bool',
        'sqrt','floor','ceil','abs','max','min','range','type','has','get','remove',
        'map','filter','reduce','sum','sorted','reverse','unique','join',
        'fetch','json_parse','json_stringify','read_file','write_file','append_file',
        'exec','env','sleep','time_ms','date','render','call_best',
        'spawn','join','pmap','re_match','re_find','re_replace','re_split',
        'db_open','db_exec','db_query','db_close','serve'];
      const items = [];
      kw.forEach(k => items.push({
        label: k, kind: monaco.languages.CompletionItemKind.Keyword,
        insertText: k, range }));
      builtins.forEach(b => items.push({
        label: b, kind: monaco.languages.CompletionItemKind.Function,
        insertText: b + '()', range }));
      // garden functions from live data
      (gardenData?.functions || []).forEach(f => {
        items.push({
          label: f.name, kind: monaco.languages.CompletionItemKind.Method,
          detail: `${f.variants.length} variants in garden`,
          insertText: f.name, range });
      });
      return { suggestions: items };
    }
  });

  // Hover: garden function health/fitness
  monaco.languages.registerHoverProvider('javascript', {
    provideHover: function(model, position) {
      const word = model.getWordAtPosition(position);
      if (!word || !gardenData) return null;
      const fam = (gardenData.functions || []).find(f => f.name === word.word);
      if (!fam) return null;
      const healthy = fam.variants.filter(v => v.health === 'healthy').length;
      const best = fam.variants.reduce((a,b) => a.fitness > b.fitness ? a : b);
      const probes = (gardenData.probes || []).find(p => p.name === word.word);
      return { contents: [
        { value: `**${word.word}** — garden lineage` },
        { value: `${fam.variants.length} variants (${healthy} healthy) · fittest #${best.id} @ ${best.fitness}%${probes ? ` · ${probes.count} probes` : ''}` },
      ]};
    }
  });

  // Register Veldt language keywords
  monaco.languages.setMonarchTokensProvider('javascript', {
    tokenizer: {
      root: [
        [/#.*$/, 'comment'],
        [/\b(fn|let|if|else|while|for|in|return|grow|struct|test)\b/, 'keyword'],
        [/\b(int|str|bool|list)\b/, 'type'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/'([^'\\]|\\.)*'/, 'string'],
        [/\d+/, 'number'],
        [/[{}()\[\]]/, '@brackets'],
        [/[+\-*/%<>=!&|]/, 'operator'],
        [/[a-zA-Z_]\w*/, 'identifier'],
      ]
    }
  });
});

function getStarterCode() {
  return `# Welcome to Veldt Studio
# Edit this code, then click Run to execute it.
# Use "grow" to plant functions into the garden.

fn greet(name: str) {
    print("hello " + name)
}

greet("world")

# Grow a function with a test — it gets trialed at birth
grow fn double(x: int) test double(3) == 6 {
    return x * 2
}

# Click "Evolve" to mutate existing functions and watch them compete
`;
}

// --- API calls ---

async function fetchGarden() {
  const res = await fetch(API + '/api/garden');
  gardenData = await res.json();
  renderGarden();
}

async function runProgram() {
  const source = editor.getValue();
  document.getElementById('output').innerHTML = '';
  document.getElementById('outputStatus').innerHTML = '<span class="spinner"></span> running...';

  const res = await fetch(API + '/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source })
  });
  const data = await res.json();

  const output = document.getElementById('output');
  if (data.output) {
    data.output.split('\n').forEach(line => {
      if (line.trim()) {
        const div = document.createElement('div');
        div.className = 'output-line';
        div.textContent = line;
        output.appendChild(div);
      }
    });
  }
  if (data.events) {
    data.events.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'output-line event';
      div.textContent = ev;
      output.appendChild(div);
    });
  }
  if (!data.success) {
    const div = document.createElement('div');
    div.className = 'output-line error';
    div.textContent = '✗ Program failed';
    output.appendChild(div);
  }

  document.getElementById('outputStatus').textContent = data.success ? '✓ done' : '✗ failed';
  fetchGarden();
}

async function evolve() {
  const output = document.getElementById('output');
  document.getElementById('outputStatus').innerHTML = '<span class="spinner"></span> evolving...';

  const res = await fetch(API + '/api/evolve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cycles: 3 })
  });
  const data = await res.json();

  if (data.events) {
    data.events.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'output-line event';
      div.textContent = ev;
      output.appendChild(div);
    });
  }

  gardenData = data.garden;
  renderGarden();
  document.getElementById('outputStatus').textContent = '✓ evolved';
}

async function clearGarden() {
  if (!confirm('Clear the entire garden? This cannot be undone.')) return;
  await fetch(API + '/api/clear', { method: 'POST' });
  fetchGarden();
}

async function pruneVariant(name, id) {
  await fetch(API + '/api/prune', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, id })
  });
  fetchGarden();
}

async function saveFile() {
  const filename = currentFilename || prompt('Save as:', 'myprogram.veldt');
  if (!filename) return;
  const source = editor.getValue();
  const res = await fetch(API + '/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, source })
  });
  const data = await res.json();
  document.getElementById('outputStatus').textContent = data.status === 'saved' ? '✓ saved' : '✗ save failed';
  loadFileList();
}

async function loadFileList() {
  const res = await fetch(API + '/api/files');
  const data = await res.json();
  const sel = document.getElementById('fileSelector');
  sel.innerHTML = '<option value="">— open file —</option>';
  if (data.files) {
    data.files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = 'examples/' + f;
      opt.textContent = f;
      sel.appendChild(opt);
    });
  }
}

async function openFile(path) {
  if (!path) return;
  currentFilename = path;
  const res = await fetch(path);
  const text = await res.text();
  editor.setValue(text);
}

// --- Rendering ---

function renderGarden() {
  const el = document.getElementById('gardenTree');
  if (!gardenData) return;

  let html = '';
  let totalHealthy = 0, totalSick = 0;

  // Functions — rendered as lineage trees using parent edges
  if (gardenData.functions) {
    gardenData.functions.forEach(lineage => {
      let healthy = 0, sick = 0;
      lineage.variants.forEach(v => {
        if (v.health === 'healthy') healthy++;
        else if (v.health === 'sick') sick++;
      });
      totalHealthy += healthy;
      totalSick += sick;

      const fittest = lineage.variants.reduce((a, b) => a.fitness > b.fitness ? a : b);
      // niche champions: strictly-best niche score in >=1 niche
      const nicheBest = {};
      lineage.variants.forEach(v => {
        (v.niche_scores || []).forEach(ns => {
          if (!(ns.niche in nicheBest) || ns.score > nicheBest[ns.niche].score)
            nicheBest[ns.niche] = { id: v.id, score: ns.score };
        });
      });
      const champs = new Set(Object.values(nicheBest).map(x => x.id));

      // probe pool info for this family
      const probeInfo = (gardenData.probes || []).find(p => p.name === lineage.name);
      const probeStr = probeInfo ? ` · ${probeInfo.count} probes` : '';

      html += `<div class="garden-item healthy" data-lineage="${lineage.name}">
        <span class="icon">fn</span>
        <span class="name">${lineage.name}</span>
        <span class="meta">${lineage.variants.length}v${probeStr}</span>
      </div>`;

      // Build tree: roots = no parents in-family; children attach to first parent
      const byId = {};
      lineage.variants.forEach(v => byId[v.id] = v);
      const children = {};
      const roots = [];
      lineage.variants.forEach(v => {
        const parent = (v.parents || []).find(p => byId[p]);
        if (parent === undefined) { roots.push(v); }
        else { (children[parent] = children[parent] || []).push(v); }
      });

      const renderNode = (v) => {
        const isFittest = v.id === fittest.id;
        const isChamp = champs.has(v.id);
        const kids = children[v.id] || [];
        html += `<div class="tree-node"><div class="variant-item ${v.health}" data-name="${lineage.name}" data-id="${v.id}">
          ${isFittest ? '<span class="star">◆</span> ' : ''}<span class="vid">#${v.id}</span> ${v.health}
          ${isChamp ? '<span class="niche-badge">niche</span>' : ''}
          <span style="float:right;color:var(--text-dim)">${v.fitness}%</span>
          ${v.origin && v.origin !== 'seed' ? `<div class="origin-tag">${v.origin}</div>` : ''}
        </div>`;
        if (kids.length) {
          html += '<div class="tree-children">';
          kids.forEach(renderNode);
          html += '</div>';
        }
        html += '</div>';
      };
      roots.forEach(renderNode);
    });
  }

  // Variables
  if (gardenData.variables && gardenData.variables.length > 0) {
    html += '<div style="padding:8px 12px 4px;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">Immortal</div>';
    gardenData.variables.forEach(name => {
      html += `<div class="garden-item immortal"><span class="icon">$</span><span class="name">${name}</span></div>`;
    });
  }

  // Structs
  if (gardenData.structs && gardenData.structs.length > 0) {
    gardenData.structs.forEach(s => {
      html += `<div class="garden-item immortal"><span class="icon">S</span><span class="name">${s.name}</span></div>`;
    });
  }

  if (!gardenData.functions || gardenData.functions.length === 0) {
    html = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12px;font-style:italic">The garden is empty.<br>Run a program to plant code.</div>';
  }

  el.innerHTML = html;

  // Click handlers
  el.querySelectorAll('.variant-item').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.dataset.name;
      const id = parseInt(item.dataset.id);
      selectVariant(name, id);
    });
  });
}

function selectVariant(name, id) {
  if (!gardenData) return;
  const lineage = gardenData.functions.find(f => f.name === name);
  if (!lineage) return;
  const variant = lineage.variants.find(v => v.id === id);
  if (!variant) return;

  const fittest = lineage.variants.reduce((a, b) => a.fitness > b.fitness ? a : b);
  const isFittest = variant.id === fittest.id;
  const lastUsed = variant.last_used === 0 ? 'never' : (gardenData.run_count - variant.last_used) + ' runs ago';

  const el = document.getElementById('inspector');
  el.innerHTML = `
    <div class="inspector-title">${name}#${id} ${isFittest ? '◆' : ''}</div>
    <div class="inspector-stat"><span class="key">health</span><span class="val" style="color:${variant.health === 'healthy' ? 'var(--moss-bright)' : variant.health === 'sick' ? 'var(--rust)' : 'var(--ash)'}">${variant.health}</span></div>
    ${variant.health_detail ? `<div style="padding:4px 0;font-size:11px;color:var(--rust);font-style:italic">${variant.health_detail}</div>` : ''}
    <div class="inspector-stat"><span class="key">age</span><span class="val">${variant.age}</span></div>
    <div class="inspector-stat"><span class="key">lifespan</span><span class="val">${variant.lifespan}</span></div>
    <div class="inspector-stat"><span class="key">usage</span><span class="val">${variant.usage}</span></div>
    <div class="inspector-stat"><span class="key">fitness</span><span class="val">${variant.fitness}%</span></div>
    <div class="inspector-stat"><span class="key">trial score</span><span class="val">${variant.trial_score}%</span></div>
    <div class="inspector-stat"><span class="key">last used</span><span class="val">${lastUsed}</span></div>
    ${variant.healing_attempts > 0 ? `<div class="inspector-stat"><span class="key">heals</span><span class="val">${variant.healing_attempts}</span></div>` : ''}
    <div class="inspector-stat"><span class="key">lineage</span><span class="val">${lineage.variants.length} variants</span></div>
    ${variant.origin ? `<div class="inspector-stat"><span class="key">origin</span><span class="val" style="font-size:10px">${variant.origin}</span></div>` : ''}
    ${variant.parents && variant.parents.length ? `<div class="inspector-stat"><span class="key">parents</span><span class="val">${variant.parents.map(p => '#' + p).join(', ')}</span></div>` : ''}
    <div class="diff-title">Body</div>
    <div class="diff-view">${(variant.body_source || '').split('\n').map(l => `<div class="diff-line same">  ${l.replace(/</g,'&lt;')}</div>`).join('')}</div>
    ${variant.parents && variant.parents.length ? (() => {
        const parent = lineage.variants.find(v => v.id === variant.parents[0]);
        if (!parent || !parent.body_source) return '';
        const pLines = parent.body_source.split('\n');
        const cLines = (variant.body_source || '').split('\n');
        let rows = '';
        const max = Math.max(pLines.length, cLines.length);
        for (let i = 0; i < max; i++) {
            const p = pLines[i], c = cLines[i];
            if (p === c && p !== undefined) rows += `<div class="diff-line same">  ${p.replace(/</g,'&lt;')}</div>`;
            else {
                if (p !== undefined) rows += `<div class="diff-line del">- ${p.replace(/</g,'&lt;')}</div>`;
                if (c !== undefined) rows += `<div class="diff-line add">+ ${c.replace(/</g,'&lt;')}</div>`;
            }
        }
        return `<div class="diff-title">Diff vs #${parent.id} (parent)</div><div class="diff-view">${rows}</div>`;
    })() : ''}
    ${(variant.niche_scores || []).length ? `
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px">Niche scores</div>
      ${variant.niche_scores.map(ns => `
        <div class="niche-bar">
          <span class="niche-name">${ns.niche}</span>
          <span class="niche-track"><span class="niche-fill" style="width:${ns.score}%"></span></span>
          <span class="niche-pct">${ns.score}%</span>
        </div>`).join('')}` : ''}
    <div class="inspector-actions">
      <button class="btn danger" onclick="pruneVariant('${name}', ${id})">Prune</button>
    </div>
    <div class="obituary-list">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Fallen Leaves</div>
      ${(gardenData.obituaries || []).slice(0, 10).map(o => `
        <div class="obituary-item">
          <span class="name">${o.name}#${o.id}</span> — age ${o.age}
          <div class="cause">${o.cause}</div>
        </div>
      `).join('') || '<div style="color:var(--text-dim);font-size:11px;font-style:italic">No deaths.</div>'}
    </div>
  `;
}

// --- Gardener agent ---

function switchTab(which) {
  const panel = document.getElementById('rightPanel');
  const inspector = document.getElementById('inspector');
  const agent = document.getElementById('agentPanel');
  document.getElementById('tabInspector').classList.toggle('active', which === 'inspector');
  document.getElementById('tabAgent').classList.toggle('active', which === 'agent');
  inspector.style.display = which === 'inspector' ? '' : 'none';
  agent.style.display = which === 'agent' ? 'flex' : 'none';
  panel.classList.toggle('wide', which === 'agent');
}

function agentScroll() {
  const el = document.getElementById('agentMessages');
  el.scrollTop = el.scrollHeight;
}

function appendUserMsg(text) {
  const empty = document.querySelector('#agentMessages .agent-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'agent-msg user';
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = 'you';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(who);
  div.appendChild(bubble);
  document.getElementById('agentMessages').appendChild(div);
  agentScroll();
}

function renderAgentResponse(data) {
  const msgs = document.getElementById('agentMessages');
  const div = document.createElement('div');
  div.className = 'agent-msg gardener';

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = 'the gardener';
  div.appendChild(who);

  if (data.steps && data.steps.length) {
    const stepsEl = document.createElement('div');
    stepsEl.className = 'agent-steps';
    data.steps.forEach(s => {
      const st = document.createElement('div');
      st.className = 'agent-step ' + s.kind;
      st.textContent = s.text;
      stepsEl.appendChild(st);
    });
    div.appendChild(stepsEl);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = data.reply || '';
  div.appendChild(bubble);

  if (data.code) {
    lastAgentCode = data.code;
    const block = document.createElement('div');
    block.className = 'agent-block';
    const pre = document.createElement('pre');
    pre.textContent = data.code;
    block.appendChild(pre);
    const actions = document.createElement('div');
    actions.className = 'block-actions';
    const insertBtn = document.createElement('button');
    insertBtn.className = 'btn primary';
    insertBtn.textContent = 'Insert into editor';
    insertBtn.addEventListener('click', () => {
      const cur = editor.getValue();
      editor.setValue(cur ? cur.replace(/\s+$/, '') + '\n\n' + data.code : data.code);
      editor.revealLine(editor.getModel().getLineCount());
    });
    actions.appendChild(insertBtn);
    block.appendChild(actions);
    div.appendChild(block);
  }

  if (data.output && data.output.trim()) {
    const block = document.createElement('div');
    block.className = 'agent-block';
    const pre = document.createElement('pre');
    pre.textContent = data.output;
    block.appendChild(pre);
    div.appendChild(block);
  }

  msgs.appendChild(div);
  agentScroll();
}

function askAgent(text) {
  document.getElementById('agentInput').value = text;
  sendAgentTask();
}

async function sendAgentTask() {
  const input = document.getElementById('agentInput');
  const task = input.value.trim();
  if (!task) return;
  input.value = '';
  appendUserMsg(task);

  // Client-side: "insert it" / "add it to the editor" — no server round-trip
  if (/insert|add (it|that|the code) to (the )?editor|put (it|that) in/i.test(task)) {
    if (lastAgentCode) {
      const cur = editor.getValue();
      editor.setValue(cur ? cur.replace(/\s+$/, '') + '\n\n' + lastAgentCode : lastAgentCode);
      renderAgentResponse({ reply: 'Inserted the last generated code into your editor.' });
    } else {
      renderAgentResponse({ reply: 'Nothing to insert — ask me to write something first.' });
    }
    return;
  }

  const msgs = document.getElementById('agentMessages');
  const thinking = document.createElement('div');
  thinking.className = 'agent-msg gardener agent-thinking';
  thinking.innerHTML = '<span class="spinner"></span> the gardener is thinking...';
  msgs.appendChild(thinking);
  agentScroll();

  try {
    const res = await fetch(API + '/api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, source: editor.getValue() })
    });
    const data = await res.json();
    thinking.remove();
    renderAgentResponse(data);
    if (data.garden) {
      gardenData = data.garden;
      renderGarden();
    }
  } catch (e) {
    thinking.remove();
    renderAgentResponse({ reply: 'Something went wrong talking to the server: ' + e });
  }
}

// --- Event handlers ---
document.getElementById('tabInspector').addEventListener('click', () => switchTab('inspector'));
document.getElementById('tabAgent').addEventListener('click', () => switchTab('agent'));
document.getElementById('agentSend').addEventListener('click', sendAgentTask);
document.getElementById('agentInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendAgentTask();
});
document.getElementById('runBtn').addEventListener('click', runProgram);
document.getElementById('evolveBtn').addEventListener('click', evolve);
document.getElementById('clearBtn').addEventListener('click', clearGarden);
document.getElementById('saveBtn').addEventListener('click', saveFile);
document.getElementById('fileSelector').addEventListener('change', e => openFile(e.target.value));

// Keyboard shortcut: Cmd/Ctrl+Enter to run
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    runProgram();
  }
});

// --- Init ---
loadFileList();
fetchGarden();
// Auto-refresh garden every 5 seconds
setInterval(fetchGarden, 5000);
</script>
