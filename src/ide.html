<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veldt Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #050807;
    --bg-soil: #0c1210;
    --bg-card: #0f1614;
    --bg-editor: #0a0e0c;
    --moss: #4a7c59;
    --moss-bright: #6fae7f;
    --moss-glow: rgba(111, 174, 127, 0.15);
    --bloom: #8ec5a0;
    --amber: #c9a96e;
    --rust: #b85450;
    --ash: #5a6560;
    --fog: #8a9590;
    --text: #b8c8be;
    --text-dim: #5a6b62;
    --border: rgba(74, 124, 89, 0.15);
    --border-bright: rgba(111, 174, 127, 0.3);
  }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--bg-soil);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--bloom);
  }
  .logo em { font-style: italic; color: var(--amber); }
  .file-selector {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .file-selector:hover { border-color: var(--border-bright); }
  .topbar-right { display: flex; gap: 8px; }
  .btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--border-bright); color: var(--bloom); }
  .btn.primary {
    background: rgba(111, 174, 127, 0.1);
    border-color: var(--moss-bright);
    color: var(--moss-bright);
  }
  .btn.primary:hover { background: rgba(111, 174, 127, 0.2); }
  .btn.amber {
    border-color: var(--amber);
    color: var(--amber);
  }
  .btn.amber:hover { background: rgba(201, 169, 110, 0.1); }
  .btn.danger {
    border-color: rgba(184, 84, 80, 0.3);
    color: var(--rust);
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left: Garden panel */
  .garden-panel {
    width: 260px;
    background: var(--bg-soil);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--fog);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .garden-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .garden-item {
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .garden-item:hover { background: rgba(111, 174, 127, 0.05); }
  .garden-item.selected { background: rgba(111, 174, 127, 0.1); }
  .garden-item .icon { color: var(--moss-bright); font-size: 14px; }
  .garden-item .name { color: var(--text); }
  .garden-item .meta { color: var(--text-dim); font-size: 10px; margin-left: auto; }
  .garden-item.healthy .icon { color: var(--moss-bright); }
  .garden-item.sick .icon { color: var(--rust); }
  .garden-item.dying .icon { color: var(--ash); }
  .garden-item.immortal .icon { color: var(--amber); }
  .variant-item {
    padding: 4px 12px 4px 28px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .variant-item:hover { color: var(--text); }
  .variant-item .star { color: var(--amber); }
  .variant-item.healthy { color: var(--moss-bright); }
  .variant-item.sick { color: var(--rust); }

  /* Center: Editor + Output */
  .center-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .editor-container {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #editor {
    position: absolute;
    inset: 0;
  }

  /* Output bar */
  .output-panel {
    height: 180px;
    background: var(--bg-editor);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .output-header {
    padding: 6px 16px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .output-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    font-size: 12px;
    line-height: 1.6;
  }
  .output-line { white-space: pre-wrap; }
  .output-line.event { color: var(--amber); }
  .output-line.error { color: var(--rust); }
  .output-line.success { color: var(--moss-bright); }

  /* Right: Inspector */
  .inspector-panel {
    width: 280px;
    background: var(--bg-soil);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .inspector-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .inspector-empty {
    color: var(--text-dim);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    text-align: center;
    padding: 40px 20px;
  }
  .inspector-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--bloom);
    margin-bottom: 16px;
  }
  .inspector-stat {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .inspector-stat .key { color: var(--text-dim); }
  .inspector-stat .val { color: var(--text); font-weight: 500; }
  .inspector-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .inspector-actions .btn { flex: 1; text-align: center; padding: 6px; font-size: 11px; }
  .obituary-list {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .obituary-item {
    padding: 8px 0;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .obituary-item .name { color: var(--fog); }
  .obituary-item .cause { color: var(--amber); font-style: italic; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--moss-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Monaco theme overrides */
  .monaco-editor .margin { background: var(--bg-editor) !important; }
  .monaco-editor .monaco-editor-background { background: var(--bg-editor) !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Veldt <em>Studio</em></div>
    <select class="file-selector" id="fileSelector">
      <option value="">— open file —</option>
    </select>
  </div>
  <div class="topbar-right">
    <button class="btn" id="saveBtn">Save</button>
    <button class="btn amber" id="evolveBtn">Evolve</button>
    <button class="btn danger" id="clearBtn">Clear Garden</button>
    <button class="btn primary" id="runBtn">▶ Run</button>
  </div>
</div>

<div class="main">
  <!-- Garden Panel -->
  <div class="garden-panel">
    <div class="panel-header">Garden</div>
    <div class="garden-content" id="gardenTree"></div>
  </div>

  <!-- Center: Editor + Output -->
  <div class="center-panel">
    <div class="editor-container">
      <div id="editor"></div>
    </div>
    <div class="output-panel">
      <div class="output-header">
        <span>Output</span>
        <span id="outputStatus"></span>
      </div>
      <div class="output-content" id="output"></div>
    </div>
  </div>

  <!-- Inspector Panel -->
  <div class="inspector-panel">
    <div class="panel-header">Inspector</div>
    <div class="inspector-content" id="inspector">
      <div class="inspector-empty">Select a function from the garden to inspect it.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
const API = '';
let gardenData = null;
let selectedVariant = null;
let editor = null;
let currentFilename = '';

// --- Monaco Editor ---
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
require(['vs/editor/editor.main'], function() {
  monaco.editor.defineTheme('veldt', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'keyword', foreground: '6fae7f', fontStyle: 'bold' },
      { token: 'string', foreground: 'c9a96e' },
      { token: 'number', foreground: '8ec5a0' },
      { token: 'comment', foreground: '5a6b62', fontStyle: 'italic' },
      { token: 'type', foreground: '6fae7f' },
    ],
    colors: {
      'editor.background': '#0a0e0c',
      'editor.foreground': '#b8c8be',
      'editorLineNumber.foreground': '#5a6b62',
      'editor.selectionBackground': '#1a2a20',
      'editor.lineHighlightBackground': '#0f1614',
      'editorCursor.foreground': '#6fae7f',
    }
  });

  editor = monaco.editor.create(document.getElementById('editor'), {
    value: getStarterCode(),
    language: 'javascript', // close enough for highlighting
    theme: 'veldt',
    fontFamily: 'JetBrains Mono, monospace',
    fontSize: 14,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    padding: { top: 16, bottom: 16 },
    automaticLayout: true,
    tabSize: 4,
  });

  // Register Veldt language keywords
  monaco.languages.setMonarchTokensProvider('javascript', {
    tokenizer: {
      root: [
        [/#.*$/, 'comment'],
        [/\b(fn|let|if|else|while|for|in|return|grow|struct|test)\b/, 'keyword'],
        [/\b(int|str|bool|list)\b/, 'type'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/'([^'\\]|\\.)*'/, 'string'],
        [/\d+/, 'number'],
        [/[{}()\[\]]/, '@brackets'],
        [/[+\-*/%<>=!&|]/, 'operator'],
        [/[a-zA-Z_]\w*/, 'identifier'],
      ]
    }
  });
});

function getStarterCode() {
  return `# Welcome to Veldt Studio
# Edit this code, then click Run to execute it.
# Use "grow" to plant functions into the garden.

fn greet(name: str) {
    print("hello " + name)
}

greet("world")

# Grow a function with a test — it gets trialed at birth
grow fn double(x: int) test double(3) == 6 {
    return x * 2
}

# Click "Evolve" to mutate existing functions and watch them compete
`;
}

// --- API calls ---

async function fetchGarden() {
  const res = await fetch(API + '/api/garden');
  gardenData = await res.json();
  renderGarden();
}

async function runProgram() {
  const source = editor.getValue();
  document.getElementById('output').innerHTML = '';
  document.getElementById('outputStatus').innerHTML = '<span class="spinner"></span> running...';

  const res = await fetch(API + '/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source })
  });
  const data = await res.json();

  const output = document.getElementById('output');
  if (data.output) {
    data.output.split('\n').forEach(line => {
      if (line.trim()) {
        const div = document.createElement('div');
        div.className = 'output-line';
        div.textContent = line;
        output.appendChild(div);
      }
    });
  }
  if (data.events) {
    data.events.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'output-line event';
      div.textContent = ev;
      output.appendChild(div);
    });
  }
  if (!data.success) {
    const div = document.createElement('div');
    div.className = 'output-line error';
    div.textContent = '✗ Program failed';
    output.appendChild(div);
  }

  document.getElementById('outputStatus').textContent = data.success ? '✓ done' : '✗ failed';
  fetchGarden();
}

async function evolve() {
  const output = document.getElementById('output');
  document.getElementById('outputStatus').innerHTML = '<span class="spinner"></span> evolving...';

  const res = await fetch(API + '/api/evolve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cycles: 3 })
  });
  const data = await res.json();

  if (data.events) {
    data.events.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'output-line event';
      div.textContent = ev;
      output.appendChild(div);
    });
  }

  gardenData = data.garden;
  renderGarden();
  document.getElementById('outputStatus').textContent = '✓ evolved';
}

async function clearGarden() {
  if (!confirm('Clear the entire garden? This cannot be undone.')) return;
  await fetch(API + '/api/clear', { method: 'POST' });
  fetchGarden();
}

async function pruneVariant(name, id) {
  await fetch(API + '/api/prune', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, id })
  });
  fetchGarden();
}

async function saveFile() {
  const filename = currentFilename || prompt('Save as:', 'myprogram.veldt');
  if (!filename) return;
  const source = editor.getValue();
  const res = await fetch(API + '/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, source })
  });
  const data = await res.json();
  document.getElementById('outputStatus').textContent = data.status === 'saved' ? '✓ saved' : '✗ save failed';
  loadFileList();
}

async function loadFileList() {
  const res = await fetch(API + '/api/files');
  const data = await res.json();
  const sel = document.getElementById('fileSelector');
  sel.innerHTML = '<option value="">— open file —</option>';
  if (data.files) {
    data.files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = 'examples/' + f;
      opt.textContent = f;
      sel.appendChild(opt);
    });
  }
}

async function openFile(path) {
  if (!path) return;
  currentFilename = path;
  const res = await fetch(path);
  const text = await res.text();
  editor.setValue(text);
}

// --- Rendering ---

function renderGarden() {
  const el = document.getElementById('gardenTree');
  if (!gardenData) return;

  let html = '';
  let totalHealthy = 0, totalSick = 0;

  // Functions
  if (gardenData.functions) {
    gardenData.functions.forEach(lineage => {
      let healthy = 0, sick = 0;
      lineage.variants.forEach(v => {
        if (v.health === 'healthy') healthy++;
        else if (v.health === 'sick') sick++;
      });
      totalHealthy += healthy;
      totalSick += sick;

      const fittest = lineage.variants.reduce((a, b) => a.fitness > b.fitness ? a : b);
      html += `<div class="garden-item healthy" data-lineage="${lineage.name}">
        <span class="icon">fn</span>
        <span class="name">${lineage.name}</span>
        <span class="meta">${lineage.variants.length}v</span>
      </div>`;

      // Show variants
      lineage.variants.forEach(v => {
        const isFittest = v.id === fittest.id;
        html += `<div class="variant-item ${v.health}" data-name="${lineage.name}" data-id="${v.id}">
          ${isFittest ? '<span class="star">◆</span> ' : ''}#${v.id} ${v.health}
          <span style="float:right;color:var(--text-dim)">${v.fitness}%</span>
        </div>`;
      });
    });
  }

  // Variables
  if (gardenData.variables && gardenData.variables.length > 0) {
    html += '<div style="padding:8px 12px 4px;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">Immortal</div>';
    gardenData.variables.forEach(name => {
      html += `<div class="garden-item immortal"><span class="icon">$</span><span class="name">${name}</span></div>`;
    });
  }

  // Structs
  if (gardenData.structs && gardenData.structs.length > 0) {
    gardenData.structs.forEach(s => {
      html += `<div class="garden-item immortal"><span class="icon">S</span><span class="name">${s.name}</span></div>`;
    });
  }

  if (!gardenData.functions || gardenData.functions.length === 0) {
    html = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12px;font-style:italic">The garden is empty.<br>Run a program to plant code.</div>';
  }

  el.innerHTML = html;

  // Click handlers
  el.querySelectorAll('.variant-item').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.dataset.name;
      const id = parseInt(item.dataset.id);
      selectVariant(name, id);
    });
  });
}

function selectVariant(name, id) {
  if (!gardenData) return;
  const lineage = gardenData.functions.find(f => f.name === name);
  if (!lineage) return;
  const variant = lineage.variants.find(v => v.id === id);
  if (!variant) return;

  const fittest = lineage.variants.reduce((a, b) => a.fitness > b.fitness ? a : b);
  const isFittest = variant.id === fittest.id;
  const lastUsed = variant.last_used === 0 ? 'never' : (gardenData.run_count - variant.last_used) + ' runs ago';

  const el = document.getElementById('inspector');
  el.innerHTML = `
    <div class="inspector-title">${name}#${id} ${isFittest ? '◆' : ''}</div>
    <div class="inspector-stat"><span class="key">health</span><span class="val" style="color:${variant.health === 'healthy' ? 'var(--moss-bright)' : variant.health === 'sick' ? 'var(--rust)' : 'var(--ash)'}">${variant.health}</span></div>
    ${variant.health_detail ? `<div style="padding:4px 0;font-size:11px;color:var(--rust);font-style:italic">${variant.health_detail}</div>` : ''}
    <div class="inspector-stat"><span class="key">age</span><span class="val">${variant.age}</span></div>
    <div class="inspector-stat"><span class="key">lifespan</span><span class="val">${variant.lifespan}</span></div>
    <div class="inspector-stat"><span class="key">usage</span><span class="val">${variant.usage}</span></div>
    <div class="inspector-stat"><span class="key">fitness</span><span class="val">${variant.fitness}%</span></div>
    <div class="inspector-stat"><span class="key">trial score</span><span class="val">${variant.trial_score}%</span></div>
    <div class="inspector-stat"><span class="key">last used</span><span class="val">${lastUsed}</span></div>
    ${variant.healing_attempts > 0 ? `<div class="inspector-stat"><span class="key">heals</span><span class="val">${variant.healing_attempts}</span></div>` : ''}
    <div class="inspector-stat"><span class="key">lineage</span><span class="val">${lineage.variants.length} variants</span></div>
    <div class="inspector-actions">
      <button class="btn danger" onclick="pruneVariant('${name}', ${id})">Prune</button>
    </div>
    <div class="obituary-list">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Fallen Leaves</div>
      ${(gardenData.obituaries || []).slice(0, 10).map(o => `
        <div class="obituary-item">
          <span class="name">${o.name}#${o.id}</span> — age ${o.age}
          <div class="cause">${o.cause}</div>
        </div>
      `).join('') || '<div style="color:var(--text-dim);font-size:11px;font-style:italic">No deaths.</div>'}
    </div>
  `;
}

// --- Event handlers ---
document.getElementById('runBtn').addEventListener('click', runProgram);
document.getElementById('evolveBtn').addEventListener('click', evolve);
document.getElementById('clearBtn').addEventListener('click', clearGarden);
document.getElementById('saveBtn').addEventListener('click', saveFile);
document.getElementById('fileSelector').addEventListener('change', e => openFile(e.target.value));

// Keyboard shortcut: Cmd/Ctrl+Enter to run
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    runProgram();
  }
});

// --- Init ---
loadFileList();
fetchGarden();
// Auto-refresh garden every 5 seconds
setInterval(fetchGarden, 5000);
</script>
</body>
</html>
