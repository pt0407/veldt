<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>veldt live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #050807; --bg-soil: #0c1210; --bg-card: #0f1614;
    --moss-bright: #6fae7f; --bloom: #8ec5a0; --amber: #c9a96e; --rust: #b85450;
    --text: #b8c8be; --text-dim: #5a6b62;
    --border: rgba(74,124,89,0.15); --border-bright: rgba(111,174,127,0.3);
  }
  body { background: var(--bg-deep); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-weight: 300;
    min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; background: var(--bg-soil); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--bloom); }
  .logo em { font-style: italic; color: var(--amber); }
  .badge { font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 28px; padding: 28px; flex-wrap: wrap;
    background: radial-gradient(circle at 30% 40%, rgba(74,124,89,0.07), transparent 65%); }
  .canvas-stage { display: flex; flex-direction: column; align-items: center;
    background: var(--bg-soil); border: 1px solid var(--border-bright); border-radius: 8px;
    padding: 12px 16px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .hud-bar { width: 100%; display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 8px; padding: 6px 12px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 5px; font-size: 12px; }
  .hud-title { color: var(--bloom); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }
  .hud-meta { color: var(--amber); }
  #gameCanvas { image-rendering: pixelated; border-radius: 5px; border: 1px solid var(--border); background: #060a08; }
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 220px; max-width: 300px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 5px; font-family: inherit; font-size: 13px; cursor: pointer; transition: all .2s; }
  .btn:hover { border-color: var(--border-bright); color: var(--bloom); }
  .btn.primary { background: rgba(111,174,127,.1); border-color: var(--moss-bright); color: var(--moss-bright); }
  #status { font-size: 12px; color: var(--text-dim); min-height: 18px; }
  #log { background: var(--bg-soil); border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 12px; font-size: 11px; line-height: 1.6; max-height: 200px;
    overflow-y: auto; white-space: pre-wrap; }
  .keys { font-size: 11px; color: var(--text-dim); line-height: 1.8; }
  .keys b { color: var(--moss-bright); font-weight: 500; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Veldt <em>Live</em></div>
  <div class="badge" id="nameBadge"></div>
</div>
<div class="stage">
  <div class="canvas-stage">
    <div class="hud-bar">
      <span class="hud-title" id="hudTitle">VELDT</span>
      <span class="hud-meta" id="hudMeta"></span>
    </div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>
  <div class="side">
    <div class="controls">
      <button class="btn primary" id="playBtn">▶ Play</button>
      <button class="btn" id="stopBtn">■ Stop</button>
      <button class="btn" id="srcBtn">Source</button>
    </div>
    <div id="status">press ▶ Play — WASD or arrows move</div>
    <div class="keys"><b>W A S D</b> / arrows — move<br><b>click the stage</b> — focus input</div>
    <div id="log"></div>
  </div>
</div>
<script>
const NAME = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'quest');
document.getElementById('nameBadge').textContent = NAME;
document.title = NAME + ' — veldt live';
let sid = null, timer = null, held = new Set();

// sprite table — sprite names → [fill, glow, shape]  (shapes below)
const SPRITES = {
  hero:    ['#6fae7f', '#8ec5a0', 'px'],   player: ['#6fae7f', '#8ec5a0', 'px'],
  hunter:  ['#d44d47', '#e05a54', 'px'],   enemy: ['#d44d47', '#e05a54', 'px'],
  exit:    ['#f0c674', '#ffd98f', 'px'],   portal: ['#f0c674', '#ffd98f', 'px'],
  coin:    ['#f0c674', '#ffd98f', 'px'],   goal:  ['#f0c674', '#ffd98f', 'px'],
  wall:    ['#1f3027', '#2e4639', 'wall'], snake: ['#4a7c59', '#6fae7f', 'seg'],
};

// pixel-sprite tilesheet — 8x8 grids per sprite name; '.' transparent.
// Real little characters, not just shapes — the visual layer.
const PX = {
  hero: [
    "..oooo..", ".o####o.", ".o#@@#o.", ".o#@@#o.", ".o####o.", "..####..",
    ".o#..#o.", "..oooo..", ],
  hunter: [
    "..####..", ".######.", ".#<##>#.", ".######.", "..#..#..", ".##..##.",
    "#......#", "........", ],
  exit: [
    "...oo...", "..o..o..", ".o....o.", "o..>>..o", "o..>>..o", ".o....o.",
    "..o..o..", "...oo...", ],
  coin: [
    "........", "...oo...", "..o$$o..", "..$$$$..", "..$$$$..", "..o$$o..",
    "...oo...", "........", ],
  player: [
    "..oooo..", ".o####o.", ".o#@@#o.", ".o#@@#o.", ".o####o.", "..####..",
    ".o#..#o.", "..oooo..", ],
};
// palette per sprite — chars -> colors
const PX_COLORS = {
  '#': '#6fae7f', '@': '#8ec5a0', 'o': '#2e4639', '<': '#ffdbd9', '>': '#ff6b6b',
  '$': '#ffd98f', '.': null,
};
const PX_HUNTER_COLORS = { '#': '#d44d47', '<': '#ff6b6b', '>': '#ff6b6b', '.': null };
const PX_GOLD_COLORS = { '#': '#f0c674', '$': '#ffd98f', 'o': '#2e4639', '.': null };

function drawSprite(ctx, ch, x, y, cell) {
  const [fill, glow, shape] = SPRITES[ch] || ['#8ec5a0', '#8ec5a0', 'px'];
  ctx.save();
  if (shape === 'wall') {
    ctx.fillStyle = fill; ctx.fillRect(x, y, cell, cell);
    ctx.fillStyle = glow; ctx.fillRect(x + 1, y + 1, cell - 2, 3);
    ctx.restore(); return;
  }
  // pixel sprite — draw the 8x8 grid scaled to the cell
  const px = PX[ch] || PX.hero;
  const colors = ch === 'hunter' || ch === 'enemy' ? PX_HUNTER_COLORS
    : (ch === 'coin' || ch === 'goal' || ch === 'exit' || ch === 'portal' ? PX_GOLD_COLORS : PX_COLORS);
  const sz = cell / 8;
  ctx.shadowColor = glow; ctx.shadowBlur = 8;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = px[r][c];
      if (p === '.') continue;
      ctx.fillStyle = colors[p] || fill;
      ctx.fillRect(x + c * sz, y + r * sz, sz + .5, sz + .5);
    }
  }
  ctx.restore();
}

function paint(frame) {
  if (!frame) return;
  const f = typeof frame === 'string' ? JSON.parse(frame) : frame;
  const cv = document.getElementById('gameCanvas'), ctx = cv.getContext('2d');
  const w = f.w || 30, h = f.h || 15;
  const cell = Math.max(14, Math.min(30, Math.floor(Math.min(600 / w, 400 / h))));
  cv.width = w * cell; cv.height = h * cell;
  ctx.clearRect(0, 0, cv.width, cv.height);
  // subtle floor grid
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    if ((r + c) % 2 === 0) { ctx.fillStyle = '#0a110d'; ctx.fillRect(c * cell, r * cell, cell, cell); }
  }
  // terrain — the map's solid cells paint as beveled stone under the actors
  const map = f.map;
  if (Array.isArray(map)) {
    for (let r = 0; r < map.length && r < h; r++) {
      const row = map[r] || '';
      for (let c = 0; c < row.length && c < w; c++) {
        const ch = row[c];
        if (ch !== ' ' && ch !== '.') {
          const x = c * cell, y = r * cell;
          ctx.fillStyle = '#1f3027'; ctx.fillRect(x, y, cell, cell);
          ctx.fillStyle = '#2e4639'; ctx.fillRect(x + 1, y + 1, cell - 2, 3);
        }
      }
    }
  }
  for (const e of (f.entities || [])) {
    const ex = e.x - (f.camera_x || 0), ey = e.y - (f.camera_y || 0);
    drawSprite(ctx, e.sprite || e.name || 'orb', ex * cell, ey * cell, cell);
  }
  // HUD text
  const hud = f.hud || {};
  const meta = Object.entries(hud).map(([k, v]) => `${k} ${v}`).join(' · ');
  document.getElementById('hudMeta').textContent = meta;
  document.getElementById('hudTitle').textContent = NAME.toUpperCase();
  // overlays — game_over / ui_menu / ui_prompt hud fields draw on the canvas
  const ov = hud.overlay, menu = hud.menu, prompt = hud.prompt;
  if (ov || menu || prompt) {
    ctx.fillStyle = 'rgba(5,10,8,.78)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center';
    if (ov) {
      ctx.fillStyle = '#f0c674'; ctx.font = 'bold 26px "Cormorant Garamond",serif';
      ctx.fillText(ov.title || 'GAME OVER', cv.width / 2, cv.height / 2 - 14);
      ctx.fillStyle = '#b8c8be'; ctx.font = '14px "JetBrains Mono",monospace';
      ctx.fillText('score ' + (ov.score || '0'), cv.width / 2, cv.height / 2 + 10);
      ctx.fillStyle = '#5a6b62'; ctx.font = '11px "JetBrains Mono",monospace';
      ctx.fillText('press R to restart', cv.width / 2, cv.height / 2 + 34);
    }
    if (menu) {
      ctx.fillStyle = '#8ec5a0'; ctx.font = 'bold 22px "Cormorant Garamond",serif';
      ctx.fillText(menu.title || 'MENU', cv.width / 2, cv.height / 2 - 30);
      const items = menu.items || [];
      items.forEach((it, i) => {
        const sel = (menu.sel === i);
        ctx.fillStyle = sel ? '#f0c674' : '#b8c8be';
        ctx.font = '13px "JetBrains Mono",monospace';
        ctx.fillText((sel ? '▶ ' : '   ') + String(it), cv.width / 2, cv.height / 2 - 4 + i * 18);
      });
    }
    if (prompt) {
      ctx.fillStyle = '#8ec5a0'; ctx.font = '15px "JetBrains Mono",monospace';
      ctx.fillText(String(prompt), cv.width / 2, cv.height / 2);
    }
    ctx.textAlign = 'left';
  }
  // sound events — a named tone per sfx() the program emitted this frame
  for (const s of (f.sfx || [])) playSfx(s);
}

// WebAudio sfx — named one-shot tones (no assets, all synthesized)
let _actx = null;
function playSfx(name) {
  try {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = _actx.currentTime, osc = _actx.createOscillator(), g = _actx.createGain();
    const FREQ = { jump: 320, coin: 880, hit: 140, win: 660, die: 90, beep: 440 };
    const f0 = FREQ[name] || 520;
    osc.type = name === 'hit' || name === 'die' ? 'sawtooth' : 'square';
    osc.frequency.setValueAtTime(f0, t);
    if (name === 'coin') osc.frequency.exponentialRampToValueAtTime(f0 * 1.6, t + 0.09);
    if (name === 'win') osc.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + 0.25);
    if (name === 'die') osc.frequency.exponentialRampToValueAtTime(f0 * 0.4, t + 0.4);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    osc.connect(g); g.connect(_actx.destination);
    osc.start(t); osc.stop(t + 0.3);
  } catch (e) { /* audio unavailable */ }
}

async function start() {
  const res = await fetch('/examples/' + NAME + '.veldt');
  if (!res.ok) { document.getElementById('status').textContent = 'no program ' + NAME; return; }
  const source = await res.text();
  const s = await fetch('/api/game/start', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source, name: NAME }) });
  const d = await s.json();
  if (!d.ok) { document.getElementById('status').textContent = d.error || 'start failed'; return; }
  sid = d.id;
  document.getElementById('status').textContent = 'live — session ' + sid;
  document.getElementById('hudTitle').textContent = NAME.toUpperCase();
  if (timer) clearInterval(timer);
  timer = setInterval(async () => {
    if (sid == null) return;
    // push held keys
    await fetch('/api/game/input', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sid, keys: [...held] }) });
    const r = await fetch('/api/game/frame?id=' + sid);
    const f = await r.json();
    if (f.ok && f.frame) paint(f.frame);
    if (f.running === false) {
      clearInterval(timer); timer = null;
      document.getElementById('status').textContent = 'session ended — ▶ to replay';
      sid = null;
    }
  }, 50); // ~20fps
}

document.getElementById('playBtn').addEventListener('click', start);
document.getElementById('stopBtn').addEventListener('click', async () => {
  if (sid != null) { await fetch('/api/game/stop', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: sid }) }); }
  if (timer) { clearInterval(timer); timer = null; }
  sid = null; held.clear();
  document.getElementById('status').textContent = 'stopped';
});
document.getElementById('srcBtn').addEventListener('click', async () => {
  const res = await fetch('/examples/' + NAME + '.veldt');
  document.getElementById('log').textContent = res.ok ? await res.text() : 'no source';
});

const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', a: 'left', s: 'down', d: 'right', W: 'up', A: 'left', S: 'down', D: 'right' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()];
  if (k) { held.add(k); e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()];
  if (k) held.delete(k);
});
start();
</script>
</body>
</html>
