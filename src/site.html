<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veldt — deployed program</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #050807; --bg-soil: #0c1210; --bg-card: #0f1614;
    --moss: #4a7c59; --moss-bright: #6fae7f; --bloom: #8ec5a0;
    --amber: #c9a96e; --rust: #b85450;
    --text: #b8c8be; --text-dim: #5a6b62;
    --border: rgba(74, 124, 89, 0.15); --border-bright: rgba(111, 174, 127, 0.3);
  }
  body {
    background: var(--bg-deep); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-weight: 300;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; background: var(--bg-soil);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--bloom); }
  .logo em { font-style: italic; color: var(--amber); }
  .badge {
    font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px;
  }
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 32px; padding: 32px; flex-wrap: wrap;
    background: radial-gradient(circle at 30% 40%, rgba(74,124,89,0.07), transparent 65%);
  }
  .canvas-stage {
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg-soil); border: 1px solid var(--border-bright);
    border-radius: 8px; padding: 14px 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .hud-bar {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 10px; padding: 6px 12px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px;
    font-size: 12px;
  }
  .hud-title { color: var(--bloom); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }
  .hud-hp-wrap { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
  .hud-hp-track {
    width: 96px; height: 9px; background: rgba(184,84,80,0.18);
    border: 1px solid rgba(184,84,80,0.4); border-radius: 5px; overflow: hidden;
  }
  .hud-hp-fill { height: 100%; background: linear-gradient(90deg, var(--rust), var(--amber), var(--moss-bright)); transition: width .25s; }
  .hud-meta { color: var(--amber); }
  #gameCanvas { image-rendering: pixelated; border-radius: 5px; border: 1px solid var(--border); background: #070b09; }
  #textOut {
    display: none; background: var(--bg-soil); border: 1px solid var(--border);
    border-radius: 8px; padding: 18px 24px; max-width: 720px; max-height: 60vh;
    overflow-y: auto; font-size: 13px; line-height: 1.7; white-space: pre-wrap;
  }
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 240px; max-width: 320px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 18px; border-radius: 5px; font-family: inherit; font-size: 13px;
    cursor: pointer; transition: all .2s;
  }
  .btn:hover { border-color: var(--border-bright); color: var(--bloom); }
  .btn.primary { background: rgba(111,174,127,0.1); border-color: var(--moss-bright); color: var(--moss-bright); }
  .btn.primary:hover { background: rgba(111,174,127,0.2); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text-dim); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  #status { font-size: 12px; color: var(--text-dim); min-height: 18px; }
  #log {
    background: var(--bg-soil); border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 12px; font-size: 11px; line-height: 1.6; color: var(--text);
    max-height: 220px; overflow-y: auto; white-space: pre-wrap;
  }
  .footer {
    padding: 10px 24px; text-align: center; font-size: 11px; color: var(--text-dim);
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--moss-bright); text-decoration: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Veldt <em>Live</em></div>
  <div class="badge" id="nameBadge"></div>
</div>
<div class="stage">
  <div class="canvas-stage" id="canvasStage" style="display:none">
    <div class="hud-bar">
      <span class="hud-title" id="hudTitle">VELDT</span>
      <div class="hud-hp-wrap" id="hudHpWrap" style="display:none">
        <span>HP</span>
        <div class="hud-hp-track"><div class="hud-hp-fill" id="hudHpFill" style="width:100%"></div></div>
      </div>
      <span class="hud-meta" id="hudMeta"></span>
    </div>
    <canvas id="gameCanvas" width="420" height="264"></canvas>
  </div>
  <pre id="textOut"></pre>
  <div class="side">
    <div class="controls">
      <button class="btn primary" id="runBtn">▶ Run</button>
      <button class="btn" id="autoBtn">⟳ Auto</button>
      <button class="btn" id="srcBtn">View Source</button>
    </div>
    <div class="legend">
      <span><i class="legend-dot" style="background:#6fae7f"></i>@ player</span>
      <span><i class="legend-dot" style="background:#e05a54"></i>E enemy</span>
      <span><i class="legend-dot" style="background:#f0c674"></i>&gt; / * goal</span>
      <span><i class="legend-dot" style="background:#2b3d34"></i># wall</span>
    </div>
    <div id="status"></div>
    <div id="log"></div>
  </div>
</div>
<div class="footer">served by <a href="/">veldt studio</a> · self-hosted — share this URL on your network or tunnel it (ngrok/tailscale) for public access</div>

<script>
const NAME = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'quest');
document.getElementById('nameBadge').textContent = NAME;
document.title = NAME + ' — veldt live';
let auto = null, runSeq = 0;

function looksLikeCanvas(text) {
  const lines = (text || '').split(/\r?\n/);
  return lines.some(l => /^\|-[A-Za-z0-9_ -]+-\|$/.test(l.trim()))
      || lines.filter(l => (l.match(/#/g) || []).length >= 5).length >= 3
      || lines.some(l => /oo@|@oo/.test(l));
}

function renderCanvas(raw, events) {
  const lines = raw.replace(/\r/g, '').split('\n');
  let title = NAME.toUpperCase(), hp = null, meta = [];
  const grid = [], logs = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t && grid.length === 0) continue;
    const tm = t.match(/^\|-([A-Za-z0-9_]+)-+\|$/);
    if (tm) { title = tm[1].toUpperCase(); continue; }
    if (t.startsWith('|') && t.endsWith('|') && t.length >= 6) {
      const inner = t.slice(1, -1);
      const pipes = (inner.match(/\|/g) || []).length;
      if (pipes >= 2 && /^[-| HP0-9]+$/.test(inner)) hp = Math.min(1, Math.max(0.08, pipes / 12));
      else { const m = inner.replace(/[@E>#]/g, ' ').trim(); if (m) meta.push(m.replace(/\s+/g, ' ')); }
      grid.push(line); continue;
    }
    const isGrid = line.includes('#') || /[o@*>]/.test(line) && !/^[a-zA-Z0-9_\[\]:.,! -]+$/.test(t);
    if (isGrid && !t.startsWith('[') && !/^(reached|didn't|path to|no path|snake at)/.test(t)) grid.push(line);
    else if (t) logs.push(t);
  }
  document.getElementById('hudTitle').textContent = title;
  const hpw = document.getElementById('hudHpWrap');
  if (hp !== null) { hpw.style.display = 'flex';
    document.getElementById('hudHpFill').style.width = Math.round(hp * 100) + '%'; }
  else hpw.style.display = 'none';
  document.getElementById('hudMeta').textContent = meta.join(' · ') || logs[0] || 'live';
  document.getElementById('log').textContent =
    [...logs, ...(events || [])].join('\n') || 'Frame rendered.';

  const cv = document.getElementById('gameCanvas'), ctx = cv.getContext('2d');
  const rows = Math.max(grid.length, 1), cols = Math.max(...grid.map(l => l.length), 1);
  const cell = Math.max(14, Math.min(22, Math.floor(Math.min(520 / cols, 280 / rows))));
  cv.width = cols * cell; cv.height = rows * cell;
  for (let r = 0; r < rows; r++) {
    const row = grid[r] || '';
    for (let c = 0; c < cols; c++) {
      const ch = row[c] || ' ', x = c * cell, y = r * cell;
      ctx.fillStyle = (r + c) % 2 === 0 ? '#09100d' : '#0c1511';
      ctx.fillRect(x, y, cell, cell);
      if (ch === '#' || ch === '|' || ch === '-') {
        const hud = (ch === '|' || ch === '-') && r < 3;
        ctx.fillStyle = hud ? '#16241d' : '#1f3027'; ctx.fillRect(x, y, cell, cell);
        ctx.fillStyle = hud ? '#243b30' : '#2e4639'; ctx.fillRect(x + 1, y + 1, cell - 2, 3);
        ctx.strokeStyle = '#0d1511'; ctx.strokeRect(x + .5, y + .5, cell - 1, cell - 1);
      } else if (ch === '@') {
        ctx.save(); ctx.shadowColor = '#6fae7f'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#6fae7f';
        ctx.beginPath(); ctx.arc(x + cell/2, y + cell/2, cell * .38, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8fff0';
        ctx.beginPath(); ctx.arc(x + cell*.42, y + cell*.4, cell*.12, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      } else if (ch === 'E') {
        ctx.save(); ctx.shadowColor = '#e05a54'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#d44d47';
        ctx.beginPath(); ctx.moveTo(x + cell/2, y + 2); ctx.lineTo(x + cell - 2, y + cell/2);
        ctx.lineTo(x + cell/2, y + cell - 2); ctx.lineTo(x + 2, y + cell/2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffdbd9'; ctx.fillRect(x + cell/2 - 1, y + cell/2 - 1, 3, 3);
        ctx.restore();
      } else if (ch === '>') {
        ctx.save(); ctx.shadowColor = '#f0c674'; ctx.shadowBlur = 9;
        ctx.strokeStyle = '#f0c674'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(x + cell/2, y + cell/2, cell * .34, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(240,198,116,.35)'; ctx.fill();
        ctx.restore();
      } else if (ch === '*') {
        ctx.save(); ctx.shadowColor = '#f0c674'; ctx.shadowBlur = 7;
        ctx.fillStyle = '#f0c674';
        ctx.beginPath(); ctx.arc(x + cell/2, y + cell/2, cell * .28, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      } else if (ch === 'o') {
        ctx.fillStyle = '#4a7c59'; ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4);
        ctx.fillStyle = '#6fae7f'; ctx.fillRect(x + 4, y + 4, cell - 8, cell - 8);
      } else if (ch !== ' ' && r >= 3) {
        ctx.fillStyle = '#8ec5a0'; ctx.font = `${Math.max(9, cell - 5)}px JetBrains Mono, monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ch, x + cell/2, y + cell/2);
      }
    }
  }
}

async function runFrame() {
  const seq = ++runSeq;
  document.getElementById('status').textContent = 'running...';
  try {
    const res = await fetch('/api/play', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ demo: NAME }) });
    const d = await res.json();
    if (seq !== runSeq) return;
    if (!d.ok) {
      document.getElementById('status').textContent = 'error';
      document.getElementById('textOut').style.display = 'block';
      document.getElementById('textOut').textContent = d.error || 'failed';
      return;
    }
    if (looksLikeCanvas(d.output)) {
      document.getElementById('canvasStage').style.display = 'flex';
      document.getElementById('textOut').style.display = 'none';
      renderCanvas(d.output, []);
    } else {
      document.getElementById('canvasStage').style.display = 'none';
      const el = document.getElementById('textOut');
      el.style.display = 'block';
      el.textContent = d.output || '(no output)';
    }
    document.getElementById('status').textContent = '✓ ' + new Date().toLocaleTimeString();
  } catch (e) {
    if (seq === runSeq) document.getElementById('status').textContent = 'error: ' + e;
  }
}

document.getElementById('runBtn').addEventListener('click', runFrame);
document.getElementById('autoBtn').addEventListener('click', () => {
  if (auto) { clearInterval(auto); auto = null;
    document.getElementById('autoBtn').textContent = '⟳ Auto'; }
  else { document.getElementById('autoBtn').textContent = '⏸ Pause';
    runFrame(); auto = setInterval(runFrame, 900); }
});
document.getElementById('srcBtn').addEventListener('click', async () => {
  const el = document.getElementById('textOut');
  el.style.display = 'block';
  try {
    const res = await fetch('/examples/' + NAME + '.veldt');
    el.textContent = res.ok ? await res.text() : 'source unavailable';
  } catch { el.textContent = 'source unavailable'; }
});
runFrame();
</script>
</body>
</html>
